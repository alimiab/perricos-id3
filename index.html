<!-- HTML file for the dog voting app -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding for the page -->
    <meta charset="UTF-8" />
    <!-- Make the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Load the api.js file (though it's mainly used via the module import in index.js) -->
    <script src="./api.js"></script>
    <!-- Title shown in the browser tab -->
    <title>Vote for Dogs</title>
    <!-- Link to the CSS file that styles the page -->
    <link rel="stylesheet" href="./index.css" />
    <!-- Swiper.js CSS for slider functionality -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  </head>
  <body>
    <!-- HEADER SECTION - Shows the title and description -->
    <header>
      <h1>🐕 Vote for Dogs</h1>
      <p>Vote for your favorite dogs!</p>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
      <!-- CONTROL BUTTONS - Add dogs or reset the app -->
      <div class="controls">
        <!-- Button to add 1 dog -->
        <button id="add-1" class="btn btn-primary">Add 1 Dog</button>
        <!-- Button to add 5 dogs -->
        <button id="add-5" class="btn btn-primary">Add 5 Dogs</button>
        <!-- Button to reset and delete all dogs -->
        <button id="reset" class="btn btn-danger">Reset All</button>
      </div>

      <!-- FILTER SECTION - Shows buttons to filter dogs by name or breed -->
      <div class="filters-section">
        <div class="filters-header">
          <!-- Search bar for breed (left) -->
          <div class="breed-search">
            <label for="breed-search-input">Search breed:</label>
            <input type="text" id="breed-search-input" placeholder="Type of breed..." autocomplete="off" />
            <div id="breed-suggestions"></div>
          </div>
          <!-- Filter type selector (right of breed search) -->
          <div class="filter-type-selector">
            <label for="filter-type">Filter by:</label>
            <select id="filter-type">
              <option value="name">Name</option>
              <option value="breed">Breed</option>
            </select>
          </div>
          <!-- Button to clear all filters -->
          <button id="clear-filters" class="btn btn-secondary">Clear Filters</button>
        </div>
        <!-- This div will be filled by JavaScript with filter buttons for each dog name or breed -->
        <div id="filters" class="filters"></div>
      </div>

      <!-- DOG COUNTER - Shows how many dogs are displayed -->
      <div class="dog-counter">
        <p>Dogs: <span id="dog-count">0</span></p>
      </div>

      <!-- Custom Modal for Reset Confirmation -->
      <div id="reset-modal" class="modal" style="display:none;">
        <div class="modal-content">
          <p>Are you sure you want to reset and delete all dogs? This action cannot be undone.</p>
          <div class="modal-actions">
            <button id="modal-confirm" class="btn btn-danger">Yes, Reset All</button>
            <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      </div>

      <!-- DOG LIST SECTION - Shows all the dog cards in a Swiper slider -->
      <!-- Swiper container for sliding dog cards -->
      <div class="swiper" id="dog-swiper">
        <!-- This div will be filled by JavaScript with dog cards as swiper slides -->
        <div class="swiper-wrapper" id="dog-list"></div>
        <!-- Pagination dots -->
        <div class="swiper-pagination"></div>
        <!-- Navigation arrows -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
      <!-- Message shown when no dogs exist -->
      <div id="no-dogs-message" class="no-dogs-message" style="display: none;">
        <p>No dogs yet. Add some to get started!</p>
      </div>

      <!-- VOTING RESULTS FORM - Submit voting data -->
      <div class="voting-form-section">
        <h2>Voting Results</h2>
        <button id="submit-votes" class="btn btn-success">Submit Voting Results</button>
        <div id="voting-results"></div>
      </div>
    </div>

    <!-- Swiper.js library for slider functionality -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <!-- Load the main JavaScript file as a module -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
