<!-- HTML file for the dog voting app -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./api.js"></script>
    <title>Vote for Dogs</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- Main title -->
    <header>
      <h1>🐕 Vote for Dogs</h1>
      <p>Vote for your favorite dogs!</p>
    </header>

    <!-- Buttons -->
    <div class="container">
      <div class="controls">
        <button id="add-1" class="btn btn-primary">Add 1 Dog</button>
        <button id="add-5" class="btn btn-primary">Add 5 Dogs</button>
        <button id="reset" class="btn btn-danger">Reset All</button>
      </div>

      <!-- <div class="filters-section">
        <h2>Filter by Name</h2>
        <div id="filters" class="filters"></div>
      </div> -->

      <div id="dog-list" class="dog-list"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
